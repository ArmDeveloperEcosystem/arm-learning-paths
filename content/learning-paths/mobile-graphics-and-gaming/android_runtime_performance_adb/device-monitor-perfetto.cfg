# The monitoring script replaces DURATION_MS with the requested capture length.
duration_ms: DURATION_MS

# Periodically write buffered trace data to the output file so longer captures
# do not fill the in-memory buffer.
write_into_file: true
file_write_period_ms: 5000
flush_period_ms: 5000

# Keep up to 64 MB of recent trace data if producers temporarily outpace writes.
buffers: {
  size_kb: 65536
  fill_policy: RING_BUFFER
}

# Poll process memory counters once per second, including processes already running
# when the trace starts.
data_sources: {
  config {
    name: "linux.process_stats"
    process_stats_config {
      scan_all_processes_on_start: true
      proc_stats_poll_ms: 1000
    }
  }
}

# Record the package-to-UID mapping used to identify the target application.
data_sources: {
  config {
    name: "android.packages_list"
  }
}

# Sample battery current and voltage once per second for power estimation.
data_sources: {
  config {
    name: "android.power"
    android_power_config {
      battery_poll_ms: 1000
      battery_counters: BATTERY_COUNTER_CURRENT
      battery_counters: BATTERY_COUNTER_VOLTAGE
    }
  }
}
