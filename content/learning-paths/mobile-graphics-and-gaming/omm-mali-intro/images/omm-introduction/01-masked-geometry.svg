<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 675' role='img'>
<title>Masked geometry creates an opacity question</title>
<style>text{font-family:Arial;fill:#163444}.h{font-size:34px;font-weight:700}.t{font-size:22px;font-weight:700}.p{font-size:17px}.panel{fill:#fff;stroke:#bfd0d8;stroke-width:2}.q{fill:#e8f0f3;stroke:#294b5c;stroke-width:4}.ray{stroke:#087bc1;stroke-width:7}.leaf{fill:#61a744;stroke:#2e7d32;stroke-width:4}</style>
<rect width='1200' height='675' fill='#f3f7f9'/><text x='55' y='60' class='h'>Why masked geometry needs an opacity decision</text>
<g transform='translate(45 110)'><rect width='340' height='465' rx='18' class='panel'/><text x='28' y='45' class='t'>1. Geometry</text><text x='28' y='76' class='p'>Traversal sees the complete Quad</text><rect x='60' y='125' width='220' height='245' class='q'/><path d='M60 125L280 370' stroke='#294b5c' stroke-width='4'/><path d='M20 100L165 205' class='ray'/><circle cx='165' cy='205' r='12' fill='#f9a825'/><text x='112' y='410' class='p'>Two original triangles</text></g>
<g transform='translate(430 110)'><rect width='340' height='465' rx='18' class='panel'/><text x='28' y='45' class='t'>2. Alpha mask</text><text x='28' y='76' class='p'>The mask defines the silhouette</text><rect x='60' y='125' width='220' height='245' fill='#dfe8ec' stroke='#294b5c' stroke-width='4'/><path class='leaf' d='M170 340V287C118 275 86 233 90 187C94 140 130 115 170 155C210 115 246 140 250 187C254 233 222 275 170 287Z'/><text x='74' y='410' class='p'>Leaf plus transparent area</text></g>
<g transform='translate(815 110)'><rect width='340' height='465' rx='18' class='panel'/><text x='28' y='45' class='t'>3. Candidate hit</text><text x='28' y='76' class='p'>The position needs an answer</text><rect x='60' y='125' width='220' height='245' class='q'/><path class='leaf' d='M170 340V287C118 275 86 233 90 187C94 140 130 115 170 155C210 115 246 140 250 187C254 233 222 275 170 287Z'/><path d='M20 100L115 186' class='ray'/><circle cx='115' cy='186' r='12' fill='#f9a825'/><path d='M115 205V380' class='ray'/><rect x='55' y='385' width='230' height='48' rx='10' fill='#fff4cf' stroke='#f9a825'/><text x='87' y='416' class='p'>Opacity evaluation</text></g>
<text x='55' y='630' class='p'>Geometry provides the intersection; opacity information decides visibility.</text>
</svg>
