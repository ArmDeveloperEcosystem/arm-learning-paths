<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 675' role='img'>
<title>Responsibilities across the OMM pipeline</title>
<style>text{font-family:Arial;fill:#163444}.h{font-size:34px;font-weight:700}.t{font-size:20px;font-weight:700}.p{font-size:16px}.s{font-size:14px}.c{fill:#fff;stroke:#9db3be;stroke-width:3}.a{stroke:#087bc1;stroke-width:5}</style>
<rect width='1200' height='675' fill='#f3f7f9'/><text x='55' y='60' class='h'>Responsibilities across the OMM pipeline</text>
<g transform='translate(15 125)'><g><rect width='255' height='390' rx='20' class='c'/><rect width='255' height='75' rx='20' fill='#eef6df'/><text x='35' y='47' class='t'>Content + authoring</text><text x='25' y='125' class='p'>Choose stable masks</text><text x='25' y='170' class='p'>Provide mesh and UVs</text><text x='25' y='215' class='p'>Bake opacity states</text><text x='25' y='260' class='p'>Balance subdivision</text><text x='25' y='335' class='s'>Output: per-triangle data</text></g><path d='M260 195H295' class='a'/>
<g transform='translate(305)'><rect width='255' height='390' rx='20' class='c'/><rect width='255' height='75' rx='20' fill='#edf0fa'/><text x='60' y='47' class='t'>Engine / RHI</text><text x='25' y='125' class='p'>Create OMM resources</text><text x='25' y='170' class='p'>Map source triangles</text><text x='25' y='215' class='p'>Build runtime geometry</text><text x='25' y='260' class='p'>Enable the pipeline</text><text x='25' y='335' class='s'>Output: OMM-enabled BLAS</text></g><path d='M565 195H600' class='a'/>
<g transform='translate(610)'><rect width='255' height='390' rx='20' class='c'/><rect width='255' height='75' rx='20' fill='#e7f3fb'/><text x='70' y='47' class='t'>API + driver</text><text x='25' y='125' class='p'>Expose feature support</text><text x='25' y='170' class='p'>Build and synchronize</text><text x='25' y='215' class='p'>Provide runtime controls</text><text x='25' y='260' class='p'>Manage device behavior</text><text x='25' y='335' class='s'>Output: execution path</text></g><path d='M870 195H905' class='a'/>
<g transform='translate(915)'><rect width='255' height='390' rx='20' fill='#e8f5e9' stroke='#2e7d32' stroke-width='3'/><rect width='255' height='75' rx='20' fill='#cfe8d0'/><text x='55' y='47' class='t'>Mali hardware</text><text x='25' y='125' class='p'>Traverse scene geometry</text><text x='25' y='170' class='p'>Locate OMM state</text><text x='25' y='215' class='p'>Accept opaque regions</text><text x='25' y='260' class='p'>Continue or fallback</text><text x='25' y='335' class='s'>Output: opacity decision</text></g></g>
<text x='600' y='590' class='t' text-anchor='middle'>OMM succeeds when every responsibility connects to the next stage.</text><text x='600' y='625' class='p' text-anchor='middle'>Use this map for design reviews, debugging, and ownership discussions.</text>
</svg>
