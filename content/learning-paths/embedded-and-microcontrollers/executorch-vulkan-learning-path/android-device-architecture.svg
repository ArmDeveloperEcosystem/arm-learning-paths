<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Android device architecture</title>
  <desc id="desc">Deployed runtime flow on the Vivo X300 Pro showing llama_main, ExecuTorch runtime, Vulkan backend, and Mali GPU, plus deployed artifacts from the host.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfd"/>
      <stop offset="1" stop-color="#edf6f5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c6e50"/>
      <stop offset="1" stop-color="#15956e"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#378e78"/>
      <stop offset="1" stop-color="#5ca992"/>
    </linearGradient>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L18,9 L0,18 Z" fill="#0a5a96"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="800" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" fill="#0f3559">Android device architecture</text>
  <text x="800" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#355f86">Deployed runtime flow on the Vivo X300 Pro</text>

  <rect x="455" y="205" width="710" height="605" rx="34" fill="#17324d" opacity="0.12"/>
  <rect x="445" y="193" width="710" height="605" rx="34" fill="url(#panel)"/>
  <text x="800" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Vivo X300 Pro</text>
  <text x="800" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" fill="#eaf6f2">arm64-v8a Android device</text>

  <rect x="530" y="355" width="540" height="87" rx="18" fill="url(#inner)" stroke="#ffffff" stroke-width="3"/>
  <text x="800" y="411" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#ffffff">llama_main</text>

  <line x1="800" y1="442" x2="800" y2="487" stroke="#0a5a96" stroke-width="12" marker-end="url(#arrow)"/>

  <rect x="530" y="500" width="540" height="87" rx="18" fill="url(#inner)" stroke="#ffffff" stroke-width="3"/>
  <text x="800" y="556" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#ffffff">ExecuTorch runtime</text>

  <line x1="800" y1="587" x2="800" y2="632" stroke="#0a5a96" stroke-width="12" marker-end="url(#arrow)"/>

  <rect x="530" y="645" width="540" height="87" rx="18" fill="url(#inner)" stroke="#ffffff" stroke-width="3"/>
  <text x="800" y="701" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#ffffff">Vulkan backend</text>

  <line x1="800" y1="732" x2="800" y2="810" stroke="#0a5a96" stroke-width="12" marker-end="url(#arrow)"/>
  <rect x="593" y="828" width="430" height="65" rx="18" fill="#17324d" opacity="0.12"/>
  <rect x="585" y="820" width="430" height="65" rx="18" fill="#082f55"/>
  <text x="800" y="864" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#ffffff">Mali GPU</text>

  <text x="80" y="430" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#123d66">Deployed artifacts from host:</text>
  <text x="80" y="480" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#123d66">• `llama_main`</text>
  <text x="80" y="530" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#123d66">• Vulkan-enabled `.pte`</text>
  <text x="80" y="580" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#123d66">• tokenizer files</text>
</svg>
