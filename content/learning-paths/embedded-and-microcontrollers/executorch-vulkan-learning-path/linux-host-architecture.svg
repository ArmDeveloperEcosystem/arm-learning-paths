<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Linux host architecture</title>
  <desc id="desc">Export, quantization, and Android build preparation on the host system, producing a Vulkan-partitioned ExecuTorch PTE artifact and staging Android NDK and ADB deployment inputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafcff"/>
      <stop offset="1" stop-color="#f1f6fb"/>
    </linearGradient>
    <linearGradient id="host" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e4d9b"/>
      <stop offset="1" stop-color="#1769b4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L22,11 L0,22 Z" fill="#0a4f91"/>
    </marker>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>

  <text x="768" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#0c2f56">Linux host architecture</text>
  <text x="768" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#405f7e">Export, quantization, and Android build preparation on the host system</text>

  <rect x="104" y="235" width="556" height="364" rx="30" fill="#123457" opacity="0.10"/>
  <rect x="94" y="223" width="556" height="364" rx="30" fill="url(#host)"/>
  <text x="145" y="308" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#ffffff">Linux host</text>
  <text x="145" y="368" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" fill="#ffffff">PyTorch + ExecuTorch 1.4</text>
  <text x="145" y="436" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff">• Load Llama 3.2 checkpoint and tokenizer</text>
  <text x="145" y="484" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff">• Apply 8da4w quantization settings</text>
  <text x="145" y="532" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff">• Lower and partition the graph for Vulkan</text>

  <text x="875" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#0c2f56">export / quantize / Vulkan partition</text>
  <line x1="650" y1="410" x2="1104" y2="410" stroke="#0a4f91" stroke-width="11" marker-end="url(#arrow)"/>

  <rect x="1112" y="269" width="340" height="310" rx="28" fill="#123457" opacity="0.08"/>
  <rect x="1102" y="257" width="340" height="310" rx="28" fill="#ffffff" stroke="#0d5aa6" stroke-width="3"/>
  <text x="1272" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#0c2f56">Output artifact</text>
  <text x="1272" y="418" text-anchor="middle" font-family="Courier New, monospace" font-size="25" font-weight="700" fill="#0c2f56">Llama3.2-1B-Instruct</text>
  <text x="1272" y="458" text-anchor="middle" font-family="Courier New, monospace" font-size="25" font-weight="700" fill="#0c2f56">_vulkan_8da4w</text>
  <text x="1272" y="498" text-anchor="middle" font-family="Courier New, monospace" font-size="25" font-weight="700" fill="#0c2f56">_g64_c2048.pte</text>

  <rect x="130" y="675" width="1296" height="216" rx="28" fill="#123457" opacity="0.08"/>
  <rect x="120" y="663" width="1296" height="216" rx="28" fill="#ffffff" stroke="#0d5aa6" stroke-width="3"/>
  <text x="768" y="720" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#0c2f56">Host responsibilities</text>

  <line x1="768" y1="754" x2="768" y2="839" stroke="#c7d9ec" stroke-width="3"/>

  <g transform="translate(190,759)">
    <path d="M35 34 L48 14 M83 34 L96 14" stroke="#0d5aa6" stroke-width="5" stroke-linecap="round"/>
    <path d="M25 40 Q59 6 93 40 L99 70 H19 Z" fill="#0d5aa6"/>
    <circle cx="46" cy="49" r="4" fill="#ffffff"/>
    <circle cx="72" cy="49" r="4" fill="#ffffff"/>
  </g>
  <text x="305" y="806" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#0c2f56">Android NDK cross-build inputs</text>

  <g transform="translate(846,754)">
    <rect x="0" y="0" width="48" height="70" rx="7" fill="#0d5aa6"/>
    <rect x="7" y="7" width="34" height="50" rx="3" fill="#ffffff"/>
    <circle cx="24" cy="63" r="4" fill="#ffffff"/>
  </g>
  <text x="922" y="806" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#0c2f56">ADB deployment staging for the phone</text>
</svg>
