<svg xmlns="http://www.w3.org/2000/svg" width="720" height="912" viewBox="0 0 720 912" role="img" aria-labelledby="title description">
  <title id="title">YOLOX image-processing pipeline</title>
  <desc id="description">A JPEG image passes through resize, letterbox padding, BGR-to-RGB conversion, uint8-to-float32 conversion, and NCHW tensor packing. YOLOX inference is followed by output decoding, non-maximum suppression, and drawing bounding boxes on the original image. Resize and the two conversions are marked as eligible for KleidiCV HAL acceleration; padding and tensor packing remain part of full preprocessing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#526b78"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #173747; }
      .phase { fill: #f6f9fb; stroke: #cbd9e0; stroke-width: 1.5; }
      .heading { font-size: 22px; font-weight: 700; }
      .node { fill: #fff; stroke: #8ba2ae; stroke-width: 1.5; }
      .hal { fill: #e7f5fa; stroke: #00718f; stroke-width: 2; }
      .label { font-size: 21px; font-weight: 600; text-anchor: middle; }
      .detail { font-size: 17px; text-anchor: middle; }
      .hal-detail { fill: #005a73; }
      .flow { fill: none; stroke: #526b78; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="phase" x="16" y="86" width="688" height="444" rx="16"/>
  <rect class="phase" x="16" y="550" width="688" height="118" rx="16"/>
  <rect class="phase" x="16" y="692" width="688" height="206" rx="16"/>
  <text class="heading" x="40" y="120">1. Image preprocessing</text>
  <text class="heading" x="40" y="582">2. Model inference</text>
  <text class="heading" x="40" y="724">3. Output processing</text>

  <path class="flow" d="M360 56 V144"/>
  <path class="flow" d="M360 208 V220"/>
  <path class="flow" d="M360 284 V296"/>
  <path class="flow" d="M360 360 V372"/>
  <path class="flow" d="M360 436 V448"/>
  <path class="flow" d="M360 512 V596"/>
  <path class="flow" d="M360 652 V740"/>
  <path class="flow" d="M360 798 V818"/>

  <rect class="node" x="200" y="8" width="320" height="48" rx="24"/>
  <text class="label" x="360" y="39">JPEG image</text>

  <rect class="hal" x="120" y="144" width="480" height="64" rx="10"/>
  <text class="label" x="360" y="170">Resize (preserve aspect ratio)</text>
  <text class="detail hal-detail" x="360" y="194">KleidiCV HAL eligible</text>

  <rect class="node" x="120" y="220" width="480" height="64" rx="10"/>
  <text class="label" x="360" y="246">Letterbox padding</text>
  <text class="detail" x="360" y="270">Constant value: 114</text>

  <rect class="hal" x="120" y="296" width="480" height="64" rx="10"/>
  <text class="label" x="360" y="322">BGR-to-RGB conversion</text>
  <text class="detail hal-detail" x="360" y="346">KleidiCV HAL eligible</text>

  <rect class="hal" x="120" y="372" width="480" height="64" rx="10"/>
  <text class="label" x="360" y="398">Uint8-to-float32 conversion</text>
  <text class="detail hal-detail" x="360" y="422">KleidiCV HAL eligible</text>

  <rect class="node" x="120" y="448" width="480" height="64" rx="10"/>
  <text class="label" x="360" y="474">NCHW tensor packing</text>
  <text class="detail" x="360" y="498">[1, 3, 640, 640]</text>

  <rect class="node" x="120" y="596" width="480" height="56" rx="10"/>
  <text class="label" x="360" y="621">YOLOX inference</text>
  <text class="detail" x="360" y="643">net.forward()</text>

  <rect class="node" x="120" y="740" width="480" height="58" rx="10"/>
  <text class="label" x="360" y="765">Decode predictions</text>
  <text class="detail" x="360" y="788">Non-maximum suppression</text>

  <rect class="node" x="120" y="818" width="480" height="62" rx="10"/>
  <text class="label" x="360" y="844">Draw bounding boxes</text>
  <text class="detail" x="360" y="868">On the original image</text>
</svg>
