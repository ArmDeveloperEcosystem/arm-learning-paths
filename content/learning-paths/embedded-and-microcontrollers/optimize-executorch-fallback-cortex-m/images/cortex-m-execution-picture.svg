    </pattern>
    <style
       id="style7">
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #23383d; }
      .muted { fill: #5d7276; }
      .heading { font-size: 28px; font-weight: 600; }
      .label { font-size: 24px; }
      .small { font-size: 21px; }
      .number { font-size: 22px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    </style>
