       x1="999.20154"
       y1="308.4473"
       x2="999.20154"
       y2="672.43494"
       gradientTransform="scale(0.99179193,1.008276)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#edf8f5"
