         rx="5"
         fill="#6eafa3"
         id="rect6" />
    </pattern>
    <pattern
       id="sram-cells"
       width="30"
       height="20"
       patternUnits="userSpaceOnUse"
       x="215"
       y="817">
      <rect
         x="0"
