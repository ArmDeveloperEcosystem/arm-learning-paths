<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="840"
   height="459"
   viewBox="90 190 1390 760"
   role="img"
   aria-labelledby="title description"
   version="1.1"
   id="svg28"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <title
     id="title">One program. Three execution paths.</title>
  <desc
     id="description">A simplified view of the simulated Corstone-300 target in the FVP. The Cortex-M CPU runs the ExecuTorch runtime and executes model.pte. It dispatches the stride-one convolution to the separate Ethos-U55 NPU. On the same Cortex-M core, CMSIS-NN runs the stride-four convolution and the portable FP32 kernel runs topk. CPU and NPU both connect to shared SRAM. The connections are schematic and execution routes are chosen during export.</desc>
  <metadata
     id="metadata1">Architecture references: https://arm-software.github.io/CMSIS-Ethos-U/main/general/index.html ; https://docs.pytorch.org/executorch/stable/backends/arm-cortex-m/arm-cortex-m-overview.html</metadata>
  <defs
     id="defs7">
    <pattern
       xlink:href="#sram-cells"
       id="pattern2"
       patternTransform="scale(1)" />
    <pattern
       xlink:href="#mac-cells"
       id="pattern28"
       patternTransform="matrix(1.247055,0,0,1.4861134,-282.10492,-225.31047)" />
    <linearGradient
       id="chip-top"
       x1="90.209213"
       y1="315.3558"
       x2="90.209213"
       y2="1254.384"
       gradientTransform="matrix(1.4078384,0,0,0.71030879,-2.7136201,0)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#f0f4f4"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#e6eded"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="cpu-top"
       x1="144.48589"
