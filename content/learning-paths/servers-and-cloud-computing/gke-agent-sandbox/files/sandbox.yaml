apiVersion: v1
kind: Namespace
metadata:
  name: axion-sandbox-prototype
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: axion-python
  namespace: axion-sandbox-prototype
spec:
  podTemplate:
    metadata:
      labels:
        app: axion-python-prototype
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: arm64
        sandbox.gke.io/runtime: gvisor
        cloud.google.com/gke-nodepool: axion-sandbox-pool
      tolerations:
        - key: sandbox.gke.io/runtime
          operator: Equal
          value: gvisor
          effect: NoSchedule
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      containers:
        - name: runtime
          image: python:3.12.15-slim-bookworm
          imagePullPolicy: Always
          command: [python3, -u, -c]
          args: ["import time; time.sleep(86400)"]
          workingDir: /workspace
          env:
            - name: HOME
              value: /workspace
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      restartPolicy: OnFailure
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: axion-python-pool
  namespace: axion-sandbox-prototype
spec:
  replicas: 1
  sandboxTemplateRef:
    name: axion-python
